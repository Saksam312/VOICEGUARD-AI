apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voiceguard-hpa
  namespace: voiceguard-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voiceguard-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
