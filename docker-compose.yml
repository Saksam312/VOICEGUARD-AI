version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voiceguard-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=VOICEGUARD AI
      - SECRET_KEY=voiceguard_super_secret_jwt_key_2026_aicte_cybersecurity
      - DATABASE_URL=sqlite:///./voiceguard.db
      - AUDIO_RETENTION_MINUTES=0
      - STORE_RAW_AUDIO=false
      - STORE_FEATURE_DATA=true
    volumes:
      - voiceguard-data:/app/voiceguard.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: voiceguard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

volumes:
  voiceguard-data:
